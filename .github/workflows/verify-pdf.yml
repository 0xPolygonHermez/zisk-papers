name: Verify PDF up-to-date

on:
  pull_request:
    paths:
      - 'src/**'
      - 'scripts/build.sh'
      - '.github/workflows/verify-pdf.yml'

jobs:
  verify-pdf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Typst
        uses: typst-community/setup-typst@v3
        with:
          typst-version: '0.14.2'

      - name: Rebuild PDF
        run: ./scripts/build.sh

      - name: Check committed PDF is up to date
        run: |
          if ! git diff --exit-code --quiet src/main.pdf; then
            echo "::error::src/main.pdf is out of date with the typst source."
            echo "Please run ./scripts/build.sh and commit the resulting src/main.pdf."
            echo "--- Fonts available to Typst ---"
            typst fonts | grep -i "computer modern" || echo "(no New Computer Modern variants found)"
            echo "--- File sizes (committed vs rebuilt) ---"
            git show HEAD:src/main.pdf | wc -c
            wc -c < src/main.pdf
            echo "--- First 40 lines of byte-level diff ---"
            git show HEAD:src/main.pdf > /tmp/committed.pdf
            diff <(xxd /tmp/committed.pdf) <(xxd src/main.pdf) | head -40 || true
            exit 1
          fi